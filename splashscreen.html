<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starting ...</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            background: #18181b;
            color: white;
            font-family: system-ui, sans-serif;
        }

        .container {
            width: 100%;
            padding: 30px;
        }

        h2 {
            font-size: 22px;
            margin: 0 0 8px;
        }

        p {
            color: #a1a1aa;
            font-size: 13px;
            margin: 0 0 24px;
        }

        .loading {
            height: 4px;
            background: #3f3f46;
            border-radius: 10px;
            overflow: hidden;
        }

        .bar {
            width: 40%;
            height: 100%;
            background: #818cf8;
            border-radius: 10px;
            animation: load 1.2s ease-in-out infinite alternate;
        }

        @keyframes load {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(250%);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Ubtech Alpha 1S</h2>
        <p>Anwendung wird gestartet ...</p>

        <div class="loading">
            <div class="bar"></div>
        </div>
    </div>
</body>
</html>
